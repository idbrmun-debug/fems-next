<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>FEMS Next</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    >
    <link href="./styles.css" rel="stylesheet">
  </head>
  <body>
    <nav class="navbar navbar-expand-lg border-bottom bg-white">
      <div class="container-fluid">
        <a class="navbar-brand fw-semibold" href="#">FEMS Next</a>
        <div class="navbar-nav">
          <a class="nav-link active" href="#dashboard">Dashboard</a>
          <a class="nav-link" href="#production">Production</a>
          <a class="nav-link" href="#intensity">Intensity</a>
          <a class="nav-link" href="#maintenance">Maintenance</a>
          <a class="nav-link" href="#settings">Settings</a>
        </div>
      </div>
    </nav>

    <main class="container-fluid py-4">
      <div id="alert" class="alert d-none" role="alert"></div>

      <section id="dashboard" class="mb-4">
        <h1 class="h3">Energy Overview</h1>
        <div class="row g-3">
          <div class="col-md-3">
            <div class="metric-card">
              <span class="metric-label">Power</span>
              <strong id="metric-power">-- kW</strong>
            </div>
          </div>
          <div class="col-md-3">
            <div class="metric-card">
              <span class="metric-label">Energy</span>
              <strong id="metric-energy">-- kWh</strong>
            </div>
          </div>
          <div class="col-md-3">
            <div class="metric-card">
              <span class="metric-label">Production</span>
              <strong id="metric-production">-- units</strong>
            </div>
          </div>
          <div class="col-md-3">
            <div class="metric-card">
              <span class="metric-label">Unit Energy</span>
              <strong id="metric-intensity">--</strong>
            </div>
          </div>
        </div>
      </section>

      <section id="production" class="mb-4">
        <h2 class="h5">Production Input</h2>
        <form id="production-form" class="row g-3">
          <div class="col-md-3">
            <label class="form-label" for="factory">Factory</label>
            <input id="factory" class="form-control" type="text" value="youngsin_quartz" required>
          </div>
          <div class="col-md-3">
            <label class="form-label" for="process">Process</label>
            <input id="process" class="form-control" type="text" value="electric_furnace" required>
          </div>
          <div class="col-md-3">
            <label class="form-label" for="quantity">Quantity</label>
            <input id="quantity" class="form-control" type="number" min="0" required>
          </div>
          <div class="col-md-3 d-flex align-items-end">
            <button class="btn btn-primary w-100" type="submit">Save</button>
          </div>
          <div class="col-md-4">
            <label class="form-label" for="product">Product</label>
            <input id="product" class="form-control" type="text">
          </div>
          <div class="col-md-4">
            <label class="form-label" for="shift">Shift</label>
            <input id="shift" class="form-control" type="text">
          </div>
          <div class="col-md-4">
            <label class="form-label" for="production-file">Excel Upload</label>
            <input id="production-file" class="form-control" type="file" accept=".xlsx">
          </div>
        </form>
      </section>

      <section id="intensity" class="mb-4">
        <h2 class="h5">Electric Intensity</h2>
        <div class="row g-3">
          <div class="col-md-4">
            <div class="metric-card">
              <span class="metric-label">24h Unit Energy</span>
              <strong id="intensity-value">--</strong>
            </div>
          </div>
          <div class="col-md-4">
            <div class="metric-card">
              <span class="metric-label">Target</span>
              <strong id="intensity-target">--</strong>
            </div>
          </div>
          <div class="col-md-4">
            <div class="metric-card">
              <span class="metric-label">Gap</span>
              <strong id="intensity-gap">--</strong>
            </div>
          </div>
        </div>
      </section>

      <section id="maintenance" class="mb-4">
        <h2 class="h5">Maintenance History</h2>
        <form id="maintenance-form" class="row g-3 mb-3">
          <div class="col-md-2">
            <label class="form-label" for="maintenance-meter">Meter</label>
            <input id="maintenance-meter" class="form-control" type="text" value="gems_01" required>
          </div>
          <div class="col-md-2">
            <label class="form-label" for="maintenance-feeder">Feeder</label>
            <input id="maintenance-feeder" class="form-control" type="text" value="feeder_01" required>
          </div>
          <div class="col-md-2">
            <label class="form-label" for="maintenance-furnace">Furnace</label>
            <input id="maintenance-furnace" class="form-control" type="text" value="furnace_01" required>
          </div>
          <div class="col-md-2">
            <label class="form-label" for="maintenance-work">Work</label>
            <input id="maintenance-work" class="form-control" type="text" required>
          </div>
          <div class="col-md-2">
            <label class="form-label" for="maintenance-owner">Owner</label>
            <input id="maintenance-owner" class="form-control" type="text" required>
          </div>
          <div class="col-md-2 d-flex align-items-end">
            <button class="btn btn-primary w-100" type="submit">Add</button>
          </div>
        </form>
        <table class="table table-sm align-middle">
          <thead>
            <tr>
              <th>Date</th>
              <th>Equipment</th>
              <th>Work</th>
              <th>Owner</th>
              <th>Status</th>
            </tr>
          </thead>
          <tbody id="maintenance-rows">
            <tr>
              <td colspan="5" class="text-secondary">No records yet.</td>
            </tr>
          </tbody>
        </table>
      </section>

      <section id="settings">
        <h2 class="h5">Settings</h2>
        <form id="settings-form" class="row g-3">
          <div class="col-md-4">
            <label class="form-label" for="target">Target Unit Energy</label>
            <input id="target" class="form-control" type="number" min="0" step="0.01">
          </div>
          <div class="col-md-2 d-flex align-items-end">
            <button class="btn btn-primary w-100" type="submit">Save</button>
          </div>
          <div class="col-md-6">
            <label class="form-label" for="bucket">Bucket</label>
            <input id="bucket" class="form-control" type="text" readonly>
          </div>
        </form>
      </section>
    </main>
    <script src="./app.js"></script>
  </body>
</html>
