<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>FEMS Maintenance History</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="./dashboard-main.css" rel="stylesheet">
    <link href="./css/maintenance.css" rel="stylesheet">
  </head>
  <body>
    <div class="dashboard-shell">
      <aside class="sidebar" aria-label="FEMS navigation">
        <div class="sidebar-brand">
          <i class="bi bi-lightning-charge-fill"></i>
        </div>
        <nav class="sidebar-nav">
          <a class="sidebar-link" href="./dashboard-main.html" data-section="main">
            <i class="bi bi-house-door-fill"></i>
            <span>메인</span>
          </a>
          <a class="sidebar-link" href="./equipment.html" data-section="equipment">
            <i class="bi bi-building-gear"></i>
            <span>설비 현황</span>
          </a>
          <a class="sidebar-link" href="./factory.html" data-section="factory">
            <i class="bi bi-grid-3x3-gap-fill"></i>
            <span>공장별</span>
          </a>
          <a class="sidebar-link" href="./alarm.html" data-section="alarm">
            <i class="bi bi-exclamation-triangle-fill"></i>
            <span>알람 현황</span>
          </a>
          <a class="sidebar-link" href="./report.html" data-section="report">
            <i class="bi bi-bar-chart-line-fill"></i>
            <span>리포트</span>
          </a>
          <a class="sidebar-link" href="./production-input.html" data-section="production">
            <i class="bi bi-pencil-square"></i>
            <span>생산량 입력</span>
          </a>
          <a class="sidebar-link active" href="./maintenance.html" data-section="maintenance">
            <i class="bi bi-clipboard2-pulse-fill"></i>
            <span>유지보수 이력</span>
          </a>
          <a class="sidebar-link" href="./settings.html" data-section="settings">
            <i class="bi bi-gear-fill"></i>
            <span>설정</span>
          </a>
        </nav>
      </aside>

      <div class="main-area">
        <header class="topbar">
          <div>
            <h1><i class="bi bi-lightning-charge-fill"></i> FEMS 전력 모니터링 시스템</h1>
            <span class="system-subtitle">Factory Energy Management System</span>
          </div>
          <div class="topbar-tools">
            <span class="date-time"><i class="bi bi-calendar3"></i><span id="currentTime">-</span></span>
            <span class="refresh-state"><i class="bi bi-arrow-repeat"></i> 자동 갱신</span>
            <select id="refreshInterval" class="form-select form-select-sm" aria-label="새로고침 주기">
              <option value="5">5s</option>
              <option value="10">10s</option>
              <option value="30">30s</option>
              <option value="60">60s</option>
            </select>
            <button class="icon-button" type="button" aria-label="전체 화면">
              <i class="bi bi-fullscreen"></i>
            </button>
          </div>
        </header>

        <main class="content maintenance-content">
          <section class="maintenance-title-row">
            <div>
              <h2>유지보수 이력</h2>
              <span>설비별 점검, 수리, 부품교체 이력 관리</span>
            </div>
            <nav class="breadcrumb-text" aria-label="breadcrumb">유지보수 이력 &gt; 이력 조회</nav>
          </section>

          <section class="summary-grid-maintenance" id="summaryCards"></section>

          <section class="chart-grid-maintenance">
            <article class="panel">
              <div class="panel-header">
                <h2>월별 정지시간</h2>
                <span>단위: hour</span>
              </div>
              <div class="maintenance-chart"><canvas id="downtimeChart"></canvas></div>
            </article>
            <article class="panel">
              <div class="panel-header">
                <h2>작업유형별 비율</h2>
                <span>단위: %</span>
              </div>
              <div class="maintenance-chart"><canvas id="workTypeChart"></canvas></div>
            </article>
          </section>

          <section class="panel filter-panel">
            <div class="panel-header">
              <h2>검색/필터</h2>
              <button class="btn btn-primary btn-sm" type="button" id="openModal">
                <i class="bi bi-plus-lg"></i> 신규 이력 등록
              </button>
            </div>
            <form id="filterForm" class="filter-grid">
              <label>시작일<input id="startDate" class="form-control form-control-sm" type="date" value="2025-05-01"></label>
              <label>종료일<input id="endDate" class="form-control form-control-sm" type="date" value="2025-05-31"></label>
              <label>공장<select id="factoryFilter" class="form-select form-select-sm"></select></label>
              <label>공정<select id="processFilter" class="form-select form-select-sm"></select></label>
              <label>설비<select id="equipmentFilter" class="form-select form-select-sm"></select></label>
              <label>작업유형<select id="workTypeFilter" class="form-select form-select-sm"></select></label>
              <label>상태<select id="statusFilter" class="form-select form-select-sm"></select></label>
              <div class="filter-actions">
                <button class="btn btn-primary btn-sm" type="submit"><i class="bi bi-search"></i> 검색</button>
                <button class="btn btn-outline-secondary btn-sm" type="button" id="resetFilters"><i class="bi bi-arrow-clockwise"></i> 초기화</button>
              </div>
            </form>
          </section>

          <section class="panel history-panel">
            <div class="panel-header">
              <h2>설비별 유지보수 이력</h2>
              <span id="rowCount">0건</span>
            </div>
            <div class="table-responsive">
              <table class="table dashboard-table maintenance-table align-middle">
                <thead>
                  <tr>
                    <th>일자</th>
                    <th>공장</th>
                    <th>공정</th>
                    <th>설비</th>
                    <th>작업유형</th>
                    <th>작업내용</th>
                    <th>작업자</th>
                    <th>정지시간</th>
                    <th>비용</th>
                    <th>상태</th>
                    <th>관리</th>
                  </tr>
                </thead>
                <tbody id="maintenanceRows"></tbody>
              </table>
            </div>
          </section>
        </main>
      </div>
    </div>

    <div id="maintenanceModal" class="maintenance-modal" aria-hidden="true">
      <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
        <div class="modal-header-custom">
          <h2 id="modalTitle">유지보수 이력 등록</h2>
          <button class="icon-button" type="button" id="closeModal" aria-label="닫기"><i class="bi bi-x-lg"></i></button>
        </div>
        <form id="maintenanceForm" class="modal-form">
          <label>작업일자<input id="workDate" class="form-control" type="date" required></label>
          <label>공장<select id="modalFactory" class="form-select" required></select></label>
          <label>공정<select id="modalProcess" class="form-select" required></select></label>
          <label>설비<select id="modalEquipment" class="form-select" required></select></label>
          <label>작업유형<select id="modalWorkType" class="form-select" required></select></label>
          <label>작업자<input id="modalOwner" class="form-control" type="text" required></label>
          <label>정지시간<input id="modalDowntime" class="form-control" type="number" min="0" step="0.1" value="0"></label>
          <label>비용<input id="modalCost" class="form-control" type="number" min="0" step="1000" value="0"></label>
          <label class="wide">작업내용<textarea id="modalWork" class="form-control" rows="2" required></textarea></label>
          <label class="wide">조치내용<textarea id="modalAction" class="form-control" rows="2"></textarea></label>
          <label class="wide">비고<textarea id="modalNote" class="form-control" rows="2"></textarea></label>
          <div class="modal-actions">
            <button class="btn btn-outline-secondary" type="button" id="cancelModal">취소</button>
            <button class="btn btn-primary" type="submit">저장</button>
          </div>
        </form>
      </div>
    </div>

    <div id="saveToast" class="toast-message" role="status">저장되었습니다.</div>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
    <script src="./js/maintenance.js"></script>
  </body>
</html>
