# FEMS Next GEMS3500 collection configuration.
#
# Source reference:
#   D:\FEMS\telegraf\telegraf_d.conf
#
# This file is not mounted by docker-compose.yml yet.
# Review the device IP, slave IDs, feeder/furnace mapping, and register map
# before replacing telegraf.conf or adding this file to the Telegraf mount.

[agent]
  interval = "10s"
  round_interval = true
  metric_batch_size = 1000
  metric_buffer_limit = 10000
  collection_jitter = "0s"
  flush_interval = "10s"
  flush_jitter = "0s"
  precision = "1s"
  hostname = "fems-next-telegraf"
  omit_hostname = false
  skip_processors_after_aggregators = false

[[outputs.influxdb_v2]]
  urls = ["${INFLUXDB_URL}"]
  token = "${INFLUXDB_TOKEN}"
  organization = "${INFLUXDB_ORG}"
  bucket = "${INFLUXDB_BUCKET}"

[[inputs.modbus]]
  name = "gems3500"
  controller = "tcp://192.168.7.74:502"
  timeout = "3s"
  configuration_type = "metric"
  optimization = "max_insert"

  [inputs.modbus.tags]
    factory = "youngsin_quartz"
    process = "electric_furnace"

  # GEMS3500 #1 / slave_id = 1 / feeder_01
  [[inputs.modbus.metric]]
    slave_id = 1
    measurement = "gems_power"
    byte_order = "ABCD"

    fields = [
      { name = "avg_v",   register = "input", address = 64,   type = "UINT32", scale = 0.01 },
      { name = "avg_a",   register = "input", address = 122,  type = "UINT32", scale = 0.01 },
      { name = "power_w", register = "input", address = 124,  type = "INT32",  scale = 1.0 },
      { name = "avg_pf",  register = "input", address = 130,  type = "INT16",  scale = 0.01 },
      { name = "sum_kwh", register = "input", address = 8000, type = "UINT32", scale = 0.1 }
    ]

    [inputs.modbus.metric.tags]
      meter = "gems_01"
      feeder = "feeder_01"
      furnace = "furnace_01"

  # GEMS3500 #1 / slave_id = 1 / feeder_02
  [[inputs.modbus.metric]]
    slave_id = 1
    measurement = "gems_power"
    byte_order = "ABCD"

    fields = [
      { name = "avg_v",   register = "input", address = 64,   type = "UINT32", scale = 0.01 },
      { name = "avg_a",   register = "input", address = 162,  type = "UINT32", scale = 0.01 },
      { name = "power_w", register = "input", address = 164,  type = "INT32",  scale = 1.0 },
      { name = "avg_pf",  register = "input", address = 170,  type = "INT16",  scale = 0.01 },
      { name = "sum_kwh", register = "input", address = 8018, type = "UINT32", scale = 0.1 }
    ]

    [inputs.modbus.metric.tags]
      meter = "gems_01"
      feeder = "feeder_02"
      furnace = "furnace_02"

  # GEMS3500 #1 / slave_id = 1 / feeder_03
  [[inputs.modbus.metric]]
    slave_id = 1
    measurement = "gems_power"
    byte_order = "ABCD"

    fields = [
      { name = "avg_v",   register = "input", address = 64,   type = "UINT32", scale = 0.01 },
      { name = "avg_a",   register = "input", address = 202,  type = "UINT32", scale = 0.01 },
      { name = "power_w", register = "input", address = 204,  type = "INT32",  scale = 1.0 },
      { name = "avg_pf",  register = "input", address = 210,  type = "INT16",  scale = 0.01 },
      { name = "sum_kwh", register = "input", address = 8036, type = "UINT32", scale = 0.1 }
    ]

    [inputs.modbus.metric.tags]
      meter = "gems_01"
      feeder = "feeder_03"
      furnace = "furnace_03"

  # GEMS3500 #2 / slave_id = 2 / feeder_01
  [[inputs.modbus.metric]]
    slave_id = 2
    measurement = "gems_power"
    byte_order = "ABCD"

    fields = [
      { name = "avg_v",   register = "input", address = 64,   type = "UINT32", scale = 0.01 },
      { name = "avg_a",   register = "input", address = 122,  type = "UINT32", scale = 0.01 },
      { name = "power_w", register = "input", address = 124,  type = "INT32",  scale = 1.0 },
      { name = "avg_pf",  register = "input", address = 130,  type = "INT16",  scale = 0.01 },
      { name = "sum_kwh", register = "input", address = 8000, type = "UINT32", scale = 0.1 }
    ]

    [inputs.modbus.metric.tags]
      meter = "gems_02"
      feeder = "feeder_01"
      furnace = "furnace_04"
