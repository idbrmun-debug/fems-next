[agent]
  interval = "10s"
  round_interval = true
  metric_batch_size = 1000
  metric_buffer_limit = 10000
  collection_jitter = "0s"
  flush_interval = "10s"
  flush_jitter = "0s"
  precision = ""
  hostname = "fems-next-telegraf"
  omit_hostname = false
  skip_processors_after_aggregators = false

[[outputs.influxdb_v2]]
  urls = ["${INFLUXDB_URL}"]
  token = "${INFLUXDB_TOKEN}"
  organization = "${INFLUXDB_ORG}"
  bucket = "${INFLUXDB_BUCKET}"

# Runtime heartbeat only.
# This keeps Telegraf running during the scaffold stage without connecting to real equipment.
[[inputs.internal]]
  collect_memstats = false

# Device collection is intentionally not enabled in the initial scaffold.
# Use telegraf/templates/gems3500-modbus.example.conf as the starting point
# after the actual device protocol, register map, and scaling rules are approved.
#
# Expected output measurement:
#   name: gems_power
# Expected tags:
#   factory, process, meter, feeder, furnace
# Expected fields:
#   avg_v, avg_a, power_w, avg_pf, sum_kwh
