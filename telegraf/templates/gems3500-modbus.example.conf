# GEMS3500 / power meter Modbus TCP template.
#
# This file is intentionally not mounted by docker-compose.yml.
# Copy the relevant blocks into ../telegraf.conf only after the real device
# address, slave ID, register map, byte order, and scaling rules are confirmed.
#
# Target InfluxDB schema:
#   bucket: gems_test
#   measurement: gems_power
#   tags: factory, process, meter, feeder, furnace
#   fields: avg_v, avg_a, power_w, avg_pf, sum_kwh

# The concrete configuration derived from the legacy FEMS project is available in:
#   telegraf/gems3500-collection.conf
#
# Minimal template:
#
# [[inputs.modbus]]
#   name = "gems3500"
#   controller = "tcp://192.168.7.74:502"
#   timeout = "3s"
#   configuration_type = "metric"
#   optimization = "max_insert"
#
#   tagexclude = ["host"]
#
#   [inputs.modbus.tags]
#     factory = "youngsin_quartz"
#     process = "electric_furnace"
#     meter = "gems3500-01"
#     feeder = "main"
#     furnace = "furnace-01"
#
#   [[inputs.modbus.metric]]
#     slave_id = 1
#     measurement = "gems_power"
#     byte_order = "ABCD"
#   #
#     fields = [
#       { name = "avg_v",   register = "input", address = 64,   type = "UINT32", scale = 0.01 },
#       { name = "avg_a",   register = "input", address = 122,  type = "UINT32", scale = 0.01 },
#       { name = "power_w", register = "input", address = 124,  type = "INT32",  scale = 1.0 },
#       { name = "avg_pf",  register = "input", address = 130,  type = "INT16",  scale = 0.01 },
#       { name = "sum_kwh", register = "input", address = 8000, type = "UINT32", scale = 0.1 }
#     ]

# Optional processor template.
# Use this only if the meter exposes power in kW and the project needs watts.
#
# [[processors.converter]]
#   [processors.converter.fields]
#     float = ["avg_v", "avg_a", "power_w", "avg_pf", "sum_kwh"]

# Optional override template for serial Modbus RTU.
# Do not enable TCP and RTU inputs for the same meter at the same time.
#
# [[inputs.modbus]]
#   name = "gems_power"
#   slave_id = 1
#   timeout = "2s"
#   controller = "file:///dev/ttyUSB0"
#   baud_rate = 9600
#   data_bits = 8
#   parity = "N"
#   stop_bits = 1
